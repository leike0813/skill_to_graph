[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wait-what-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.16", "langchain==1.4.7", "langchain-core==1.6.13", "langchain-openai==1.7.2"]

[tool.setuptools.packages.find]
include = ["skill_graph*"]
